[project]
name = "second-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kseniia Iukhlina", email = "kseniyayukhlina@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
